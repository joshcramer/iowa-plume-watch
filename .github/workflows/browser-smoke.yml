name: NTNT and map checks
on:
  pull_request:
  push:
    branches: [ntnt-rewrite, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build release image
        run: docker build --build-arg APP_REVISION="$GITHUB_SHA" -t plume-check .
      - name: Run NTNT and map regressions
        run: |
          docker run --rm --network none --entrypoint ntnt plume-check lint server.tnt
          docker run --rm --network none --entrypoint ntnt plume-check validate .
          docker run --rm --network none --read-only --tmpfs /tmp:rw,uid=10001,gid=10001,mode=1770 \
            -v "$PWD/tests:/app/tests:ro" -e APP_DATABASE_PATH=/tmp/plume-test.db plume-check sh -ec '
              sh db/local-init.sh local
              ntnt run tests/official-events.tnt
              ntnt run tests/snapshots.tnt
              ntnt run tests/updates.tnt
              ntnt run tests/traffic.tnt
              sh db/local-init.sh local
            '
          docker run --rm --network none -v "$PWD/tests:/app/tests:ro" --entrypoint ntnt plume-check run tests/forecast-feed.tnt

          node --test tests/*.test.mjs
      - name: Start cold image and test the interactive map
        env:
          APP_IMAGE: plume-check
        run: |
          docker compose up --wait --wait-timeout 90 --no-build --pull never app
          curl -fsS http://127.0.0.1:8080/ready
          curl -fsS http://127.0.0.1:8080/data/forecast.json >/dev/null
          sh tests/traffic-http.sh
          printf '%s\n' '{"host":"iowaplumewatch.heylarri.com","collected_at":1795563600,"days":[{"day":"2026-11-23","requests":12,"bytes":1200,"visits":3,"views":4,"crawler_views":1,"path_views":{"/":3,"/stats":1},"audience":{"countries":{"US":3,"CA":1},"devices":{"mobile":3,"desktop":1}},"delivery":{"by_type":{"html":{"cache":0,"origin":3,"other":0},"json":{"cache":0,"origin":3,"other":1},"js":{"cache":4,"origin":1,"other":0},"css":{"cache":0,"origin":0,"other":0},"other":{"cache":0,"origin":0,"other":0}},"errors_5xx":1,"p95_ms":198}}]}' \
            | docker compose exec -T app ntnt run db/import-traffic.tnt
          TRAFFIC_EXPECT_PATHS=1 TRAFFIC_EXPECT_AUDIENCE=1 TRAFFIC_EXPECT_DELIVERY=1 sh tests/traffic-http.sh
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          PLUME_SEED_SCENARIO=1 node tests/browser-smoke.mjs
      - name: Print logs if a check fails
        if: failure()
        run: docker compose logs --no-color app
