name: Browser map overlay smoke test
on:
  push:
    paths:
      - 'assets/**'
      - 'index.html'
      - 'tests/browser-smoke.mjs'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Start static website
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/website.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/data/forecast.json >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/website.log
          exit 1
      - name: Verify actual browser overlay, map alignment, and controls
        run: node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-map-screenshots
          path: |
            browser-map-*.png
            browser-mini-maps.png
            browser-hover-inspect.png
            browser-mobile-minis.png
          if-no-files-found: ignore
