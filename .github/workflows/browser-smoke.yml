name: NTNT and map checks
on:
  pull_request:
  push:
    branches: [ntnt-rewrite, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build release image
        run: docker build --build-arg APP_REVISION="$GITHUB_SHA" -t plume-check .
      - name: Run NTNT and map regressions
        run: |
          docker run --rm --network none --entrypoint ntnt plume-check lint server.tnt
          docker run --rm --network none --entrypoint ntnt plume-check validate .
          docker run --rm --network none --read-only --tmpfs /tmp:rw,uid=10001,gid=10001,mode=1770 \
            -v "$PWD/tests:/app/tests:ro" -e APP_DATABASE_PATH=/tmp/snapshots.db --entrypoint ntnt plume-check run tests/snapshots.tnt
          docker run --rm --network none -v "$PWD/tests:/app/tests:ro" --entrypoint ntnt plume-check run tests/forecast-feed.tnt
          docker run --rm --network none -v "$PWD/tests:/app/tests:ro" --entrypoint ntnt plume-check run tests/updates.tnt
          node --test tests/*.test.mjs
      - name: Start cold image and test the interactive map
        run: |
          docker run -d --name plume-ci --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=1770 \
            -v plume-ci-data:/app/data -p 127.0.0.1:8080:8080 plume-check
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/ready; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/data/forecast.json >/dev/null
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          PLUME_SEED_SCENARIO=1 node tests/browser-smoke.mjs
      - name: Print logs if a check fails
        if: failure()
        run: docker logs plume-ci
