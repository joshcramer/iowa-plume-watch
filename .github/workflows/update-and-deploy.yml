name: Update forecast and publish Pages
on:
  push:
    branches: [main]
  schedule:
    # Scheduled every 3 hours, offset to avoid the hour boundary.
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic tests
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.test.mjs
      - name: Download latest GFS / RRFS / ECMWF pressure-level winds
        if: github.event_name != 'push' || contains(github.event.head_commit.message, 'enable-long-range-refresh')
        run: |
          python scripts/build_forecast.py || echo 'WARNING: Model request failed. Existing dated snapshot retained.'
      - name: Compute extended 24/48h trajectories (global GFS and ECMWF)
        if: github.event_name != 'push' || contains(github.event.head_commit.message, 'enable-long-range-refresh')
        run: |
          python scripts/build_extended.py || echo 'WARNING: Regional forecast unavailable; retain previously dated trajectories.'
      - name: Smoke-test the actual downloaded forecast trajectories
        run: node --test tests/live-forecast.test.mjs
      - name: Detect changed official source pages (unreviewed, not an alert)
        if: github.event_name != 'push'
        run: |
          python scripts/watch_official_sources.py || echo 'WARNING: At least one source unavailable; statuses remain unverified.'
      - name: Save snapshots to the latest main safely
        if: github.event_name != 'push' || contains(github.event.head_commit.message, 'enable-long-range-refresh')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'iowa-plume-watch[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          cp data/forecast.json "$scratch/forecast.json"
          cp data/extended-tracks.json "$scratch/extended-tracks.json"
          cp data/source-watch.json "$scratch/source-watch.json"
          # A manual rerun can start from an old SHA. Always base the
          # snapshot commit on the latest main instead of force-pushing.
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            cp "$scratch/forecast.json" data/forecast.json
            cp "$scratch/extended-tracks.json" data/extended-tracks.json
            cp "$scratch/source-watch.json" data/source-watch.json
            git add data/forecast.json data/extended-tracks.json data/source-watch.json
            if git diff --cached --quiet; then
              echo "Published snapshots are already current."
              exit 0
            fi
            git commit -m 'data: refresh forecast inputs and source-change watch'
            if git push origin HEAD:main; then
              echo "Published snapshots updated."
              exit 0
            fi
            echo "Concurrent update; retrying against the newest main (attempt $attempt)."
            sleep 2
          done
          echo "::error::Could not update snapshots after 3 attempts"
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build-and-upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm GitHub API can see the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's artifact index can lag a successful upload briefly.
          for attempt in $(seq 1 15); do
            found="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || echo 0)"
            if [[ "$found" =~ ^[0-9]+$ ]] && [ "$found" -gt 0 ]; then
              echo "GitHub Pages artifact is visible."
              exit 0
            fi
            echo "Waiting for Pages artifact registration (attempt $attempt of 15)"
            sleep 4
          done
          echo "::error::GitHub has not indexed the uploaded Pages artifact"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
