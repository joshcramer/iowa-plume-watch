# The app and worker use the same SQLite file. The replay file is disposable.
[databases.app]
engine = "sqlite"
schema = "main"
migrations_dir = "migrations"
approval_secret = "APP_MIGRATION_APPROVAL"

[databases.app.targets.local]
connection_secret = "APP_DATABASE_FILE"

[databases.app.targets.hosted]
connection_secret = "APP_DATABASE_FILE"

[databases.app.scratch]
connection_secret = "APP_REPLAY_FILE"
disposable = true

[databases.app.adoption_checks]
legacy_ledger = "SELECT EXISTS (SELECT 1 FROM main.schema_migrations WHERE version = '001_snapshots')"

[secrets.APP_DATABASE_FILE]
[secrets.APP_REPLAY_FILE]
[secrets.APP_MIGRATION_APPROVAL]
